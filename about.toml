# Configuration for `cargo about`, which generates THIRD-PARTY-NOTICES.md.
# Release packaging pins cargo-about 0.9.0 so this canonical output is reproducible.
#
# Regenerate after changing dependencies (from the workspace root):
#   cargo about generate --workspace --features smudgy_ui/web-audio-cpal \
#     --locked about.hbs -o THIRD-PARTY-NOTICES.md
#   python bin/normalize-third-party-notices.py
#
# The hand-written font / icon / runtime notices live in the template
# preamble (about.hbs); the Rust crate section below is gathered from the
# dependency graph of the shipped binary.

# Conservative union of every target shipped by the Windows installer,
# universal macOS bundle, and two-architecture Flatpak release. Release scripts
# select `smudgy_ui/web-audio-cpal`, so the generated notice covers every
# platform-specific physical-output edge in one canonical file.
targets = [
    "x86_64-pc-windows-msvc",
    "aarch64-apple-darwin",
    "x86_64-apple-darwin",
    "aarch64-unknown-linux-gnu",
    "x86_64-unknown-linux-gnu",
]

# Build- and dev-dependencies are not distributed in the binary.
ignore-build-dependencies = true
ignore-dev-dependencies = true

# Our own unpublished workspace crates (smudgy_*) carry no
# third-party obligation and should not appear in the notices.
private = { ignore = true }

# Permissive licenses we knowingly accept. Anything outside this list is
# surfaced by `cargo about generate` as a warning so it can be reviewed.
accepted = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Zlib",
    "MPL-2.0",
    "BSL-1.0",
    "Unicode-DFS-2016",
    "Unicode-3.0",
    "CC0-1.0",
    "0BSD",
    "Unlicense",
    "OpenSSL",
    "CDLA-Permissive-2.0",
    # libbz2-rs-sys, via deno_runtime -> qbsdiff (bsdiff streams are
    # bzip2-compressed) for the desktop auto-update patch op; permissive
    # BSD-style terms.
    "bzip2-1.0.6",
]
