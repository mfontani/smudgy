name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_INCREMENTAL: 0
  CARGO_TERM_COLOR: always
  # CI never reads line numbers off a backtrace, and on Linux the debug info
  # dominates target/: DWARF is embedded in each of the ~50 integration-test
  # executables, every one of which statically links V8. macOS leaves it in the
  # .o files and Windows in separate .pdb, which is why the Linux runner is the
  # one that runs out of disk. `test` inherits `dev`, so this covers the test
  # binaries as well as the dependency graph under them.
  CARGO_PROFILE_DEV_DEBUG: 0

jobs:
  fmt:
    name: Format
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6

      - name: Install pinned Rust
        run: rustup toolchain install --no-self-update

      - name: Check formatting
        run: cargo fmt --all -- --check

  test:
    name: Test (${{ matrix.os }})
    needs: fmt
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]

    steps:
      - name: Check out repository
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6

      - name: Install pinned Rust
        run: rustup toolchain install --no-self-update

      # The hosted Linux image ships ~20GB of toolchains this workspace never
      # touches. Reclaiming them before the cache unpacks is what keeps the test
      # build -- a restored ~2.2GB cache plus ~50 V8-linking test binaries --
      # inside the runner's disk; without it, codegen dies partway through with
      # `No space left on device`. `df` afterwards so the next squeeze is
      # diagnosable from the log alone.
      - name: Free runner disk space
        if: runner.os == 'Linux'
        run: |
          sudo rm -rf /usr/local/lib/android /usr/share/dotnet /opt/ghc \
            /usr/local/.ghcup /opt/hostedtoolcache/CodeQL
          df -h /

      - name: Install Linux webview dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends libwebkit2gtk-4.1-dev

      # rust-cache prunes workspace-member artifacts (the statically-linked
      # test binaries that dominate target/) before saving; caching target/
      # wholesale grew past GitHub's 10GB repo cache cap and filled runner
      # disks mid-job. cache-bin (on by default) covers ~/.cargo/bin, so the
      # patch-crate install below persists across runs.
      - name: Cache Cargo data
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          cache-on-failure: true

      # The workspace patches dependency sources via patch-crate (see patches/
      # and the workspace manifest): [patch.crates-io] points into target/patch/,
      # so cargo resolution fails until the patched crates are materialized.
      # --force rebuilds them from patches/*.patch even when a restored cache
      # carries a stale target/patch from an earlier commit.
      - name: Materialize dependency source patches
        shell: bash
        run: |
          command -v cargo-patch-crate >/dev/null 2>&1 ||
            cargo install --locked patch-crate
          cargo patch-crate --force

      - name: Check workspace
        run: cargo check --workspace --all-targets --all-features --locked

      - name: Test workspace
        # This test reaches the real OS credential service, which is not a
        # deterministic dependency on headless hosted runners.
        run: >-
          cargo test --workspace --lib --tests --locked --
          --skip models::shared_packages::tests::missing_required_params_tracks_only_unset_required_keys
