name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_INCREMENTAL: 0
  CARGO_TERM_COLOR: always

jobs:
  fmt:
    name: Format
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6

      - name: Install pinned Rust
        run: rustup toolchain install --no-self-update

      - name: Check formatting
        run: cargo fmt --all -- --check

  test:
    name: Test (${{ matrix.os }})
    needs: fmt
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]

    steps:
      - name: Check out repository
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6

      - name: Install pinned Rust
        run: rustup toolchain install --no-self-update

      - name: Install Linux webview dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends libwebkit2gtk-4.1-dev

      - name: Cache Cargo data
        uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5
        with:
          path: |
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            ~/.cargo/bin/cargo-patch-crate*
            target/
          key: ${{ runner.os }}-cargo-${{ hashFiles('Cargo.lock', 'rust-toolchain.toml') }}
          restore-keys: |
            ${{ runner.os }}-cargo-

      # The workspace patches dependency sources via patch-crate (see patches/
      # and the workspace manifest): [patch.crates-io] points into target/patch/,
      # so cargo resolution fails until the patched crates are materialized.
      # --force rebuilds them from patches/*.patch even when a restored cache
      # carries a stale target/patch from an earlier commit.
      - name: Materialize dependency source patches
        shell: bash
        run: |
          command -v cargo-patch-crate >/dev/null 2>&1 ||
            cargo install --locked patch-crate
          cargo patch-crate --force

      - name: Check workspace
        run: cargo check --workspace --all-targets --all-features --locked

      - name: Test workspace
        # This test reaches the real OS credential service, which is not a
        # deterministic dependency on headless hosted runners.
        run: >-
          cargo test --workspace --lib --tests --locked --
          --skip models::shared_packages::tests::missing_required_params_tracks_only_unset_required_keys
